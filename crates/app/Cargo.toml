[package]
name = "orrery-app"
version = "0.1.0"
edition = "2021"
description = "ORRERY desktop app: egui HMI + 3D scene"

[[bin]]
name = "orrery"
path = "src/main.rs"

[dependencies]
orrery-astro = { path = "../astro" }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
